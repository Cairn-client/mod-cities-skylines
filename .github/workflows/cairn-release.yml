name: Cairn release

# A Cairn release is a bare X.Y.Z tag on master. It builds the mod the way the project's own CI does, puts its DLLs into a Cairn mod pack
# (.github/cairn/Build-Pack.ps1) and publishes the pack, pack-index.json and game.json: the Cairn launcher reads the index to install and
# update this mod. RELEASE_CHANNEL=beta publishes a pre-release (only players who chose beta are offered it).
# (The project's own tags are v-prefixed; a bare X.Y.Z tag is a Cairn release.)
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: The tag must be on master and equal VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          git fetch origin master
          git merge-base --is-ancestor $env:GITHUB_SHA origin/master
          if ($LASTEXITCODE -ne 0) { throw "tag $env:GITHUB_REF_NAME is not on master" }
          $v = (Get-Content VERSION -TotalCount 1).Trim()
          if ($v -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME is not VERSION ($v)" }

      - name: The version string
        id: csm_version
        shell: pwsh
        run: |
          "version=$(Get-Date -Format 'yyMM').$env:GITHUB_RUN_NUMBER" >> $env:GITHUB_OUTPUT

      - name: Update the assembly version
        shell: pwsh
        working-directory: src
        env:
          CSM_VERSION: ${{ steps.csm_version.outputs.version }}
        run: ../scripts/update-version.ps1 -filePattern AssemblyInfo.cs -assemblyVersion "$env:CSM_VERSION.0.0" -assemblyFileVersion "$env:CSM_VERSION.0.0"

      # the assemblies the project's own CI builds against, from the project's own storage
      - name: Download the assemblies the mod is built against
        shell: pwsh
        run: |
          Invoke-WebRequest https://storage.citiesskylinesmultiplayer.com/Assemblies.zip -OutFile Assemblies.zip -UseBasicParsing
          Expand-Archive Assemblies.zip assemblies -Force

      - name: Build the mod
        shell: pwsh
        working-directory: src
        run: ../scripts/build.ps1 -Build

      - name: Build the pack
        shell: pwsh
        env:
          CSM_VERSION: ${{ steps.csm_version.outputs.version }}
        run: ./.github/cairn/Build-Pack.ps1 -BuildDir src/csm/bin/Release -UpstreamVersion $env:CSM_VERSION

      - name: Changelog
        shell: pwsh
        run: ./.github/cairn/New-ReleaseNotes.ps1 -OutFile notes.md -Tag $env:GITHUB_REF_NAME

      - uses: actions/upload-artifact@v4
        with:
          name: cairn-pack
          path: |
            release/Cairn-Pack-cities-skylines-*.zip
            release/pack-index.json
            .github/cairn/game/game.json

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @("release/Cairn-Pack-cities-skylines-$env:GITHUB_REF_NAME.zip", 'release/pack-index.json') + (Get-ChildItem .github/cairn/game -File | ForEach-Object { $_.FullName })
          $flags = @()
          if ((Get-Content RELEASE_CHANNEL -Raw).Trim() -eq 'beta') { $flags += '--prerelease' }
          gh release create $env:GITHUB_REF_NAME @assets --title $env:GITHUB_REF_NAME --notes-file notes.md --verify-tag @flags
